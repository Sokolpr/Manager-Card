services:
  postgres_auth:
    image: postgres:17-alpine
    container_name: postgres-auth
    ports:
      - "${POSTGRES_AUTH_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_AUTH_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD}
      POSTGRES_DB: ${POSTGRES_AUTH_DB}
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "wal_level=logical"
    networks:
      - db_auth_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.2.1-alpine
    container_name: redis_auth
    ports:
      - "${REDIS_AUTH_PORT}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_AUTH_PASSWORD}
    networks:
      - redis_auth_network

  service_auth:
    build:
      context: ../Auth-Service
      dockerfile: Dockerfile
    container_name: service_auth
    environment:
      SPRING_DATASOURCE_URL: jdbc://postgresql://postgres_auth:${POSTGRES_AUTH_DB}/${POSTGRES_AUTH_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPAHIBERNATE_DDL_AUTO: validate
      TIME_TO_LIVE_TOKEN_MINUTES: 60
      JWT_SECRET: ${JWT_SECRET}


volumes:
  postgres_auth_data:
    name: db_auth_data
  redis_data:
    name: redis_auth_data


networks:
  db_auth_network:
    driver: bridge
    internal: false
  redis_auth_network:
    driver: bridge
    internal: false